name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Discover the stack
        run: |
          image=$(aws ecr describe-repositories --repository-names erp-portal-api \
            --query 'repositories[0].repositoryUri' --output text)
          bucket=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'erp-portal-site')].Name | [0]" --output text)
          asg=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'erp-portal-app')].AutoScalingGroupName | [0]" \
            --output text)
          distribution=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(to_string(Origins.Items[].DomainName), '$bucket')].Id | [0]" \
            --output text)

          cluster=$(aws ecs list-clusters \
            --query "clusterArns[?contains(@, 'erp-portal-cluster')] | [0]" --output text)
          service=""
          if [ -n "$cluster" ] && [ "$cluster" != "None" ]; then
            service=$(aws ecs list-services --cluster "$cluster" \
              --query "serviceArns[?contains(@, 'erp-portal-api')] | [0]" --output text)
          fi

          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "SITE_BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "ASG_NAME=$asg" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$distribution" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=$cluster" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=$service" >> "$GITHUB_ENV"

          echo "image=$image bucket=$bucket asg=$asg distribution=$distribution cluster=$cluster service=$service"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        working-directory: backend
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm install --no-audit --no-fund
          npx vite build

      - name: Publish the frontend to S3
        working-directory: frontend
        run: |
          aws s3 sync dist "s3://$SITE_BUCKET" --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude index.html
          aws s3 cp dist/index.html "s3://$SITE_BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Invalidate the CloudFront cache
        run: |
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "No CloudFront distribution found, nothing to invalidate"
            exit 0
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html"

      - name: Roll out the new image
        run: |
          asg="$ASG_NAME"

          if [ -n "$ECS_SERVICE" ] && [ "$ECS_SERVICE" != "None" ]; then
            echo "stage 4 is running, forcing a new deployment of $ECS_SERVICE"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force-new-deployment >/dev/null
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE"
            exit 0
          fi

          if [ -z "$asg" ] || [ "$asg" = "None" ]; then
            echo "no Auto Scaling group and no ECS service, nothing to roll"
            exit 0
          fi

          desired=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$asg" \
            --query 'AutoScalingGroups[0].DesiredCapacity' --output text)

          if [ "$desired" = "0" ] || [ "$desired" = "None" ]; then
            echo "Auto Scaling group is empty, skipping the instance refresh"
            exit 0
          fi

          while true; do
            status=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$asg" \
              --query 'InstanceRefreshes[0].Status' --output text)

            case "$status" in
              InProgress | Pending | Cancelling)
                echo "waiting for the in flight refresh to finish, currently $status"
                sleep 30
                ;;
              *)
                break
                ;;
            esac
          done

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$asg" \
            --preferences MinHealthyPercentage=50
