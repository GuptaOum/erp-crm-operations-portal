name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: backend
        run: npx tsc

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_admin
          POSTGRES_PASSWORD: erp_admin
          POSTGRES_DB: erp_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_admin -d erp_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://erp_admin:erp_admin@localhost:5432/erp_portal_test
      JWT_SECRET: ci_jwt_secret_for_the_operations_portal
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck tests
        working-directory: backend
        run: npx tsc --noEmit --project tsconfig.test.json

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npx vite build

  render:
    if: github.event_name == 'push'
    needs: [backend, tests, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Deploy whichever half of the repository changed
        env:
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          changed=$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-files)

          trigger() {
            if [ -z "$2" ]; then
              echo "$1: no deploy hook configured, skipping"
              return 0
            fi

            code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$2")
            echo "$1: Render answered $code"
            case "$code" in
              200 | 201) return 0 ;;
              *) return 1 ;;
            esac
          }

          if echo "$changed" | grep -q '^frontend/'; then
            trigger frontend "$WEB_HOOK"
          else
            echo "frontend: unchanged, nothing to deploy"
          fi

          if echo "$changed" | grep -q '^backend/'; then
            trigger backend "$API_HOOK"
          else
            echo "backend: unchanged, nothing to deploy"
          fi
